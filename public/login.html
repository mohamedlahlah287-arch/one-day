  it: {

<script src="/assets/site-common.js"></script>
<script src="/assets/auth-google.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await window.rbInitGoogle({
    buttonEl: 'gBtnLogin',
    onCredential: async (credential) => {
      const errBox = document.getElementById('authErrorBox');
      errBox.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ credential }),
        });
        const data = await res.json();
        if (!res.ok) { errBox.textContent = data.error || window.rbT('noAccountFound'); errBox.style.display = 'block'; return; }
        window.location.href = '/dashboard/overview.html';
      } catch (e) {
        errBox.textContent = window.rbT('genericError');
        errBox.style.display = 'block';
      }
    },
  });
});
</script>
</body>
