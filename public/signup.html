<script>
document.addEventListener('DOMContentLoaded', async () => {
  await window.rbInitGoogle({
    buttonEl: 'gBtnSignup',
    onCredential: async (credential) => {
      const errBox = document.getElementById('authErrorBox');
      errBox.style.display = 'none';
      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const birthDate = document.getElementById('birthDate').value;
      if (!fullName || !phone || !birthDate) {
        errBox.textContent = window.rbT('fillFieldsFirst');
        errBox.style.display = 'block';
        return;
      }
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ credential, fullName, phone, birthDate }),
        });
        const data = await res.json();
        if (!res.ok) { errBox.textContent = data.error || window.rbT('genericError'); errBox.style.display = 'block'; return; }
        window.location.href = '/dashboard/overview.html';
      } catch (e) {
        errBox.textContent = window.rbT('genericError');
        errBox.style.display = 'block';
      }
    },
  });
});
</script>
