<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركات التوصيل — لوحة التحكم — RedonBot</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/dashboard-app.css">
</head>
<body>
<div id="appRoot" class="app" data-app-theme="dark"></div>

<script src="/assets/dashboard-app.js"></script>
<script>
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

(async function () {
  const me = await RB_APP.initShell('deliveryProviders');
  if (!me) return;

  const content = document.getElementById('appPageContent');
  content.innerHTML = `
    <div class="app-card">
      <div class="app-card-head"><h3>شركات التوصيل</h3></div>
      <p style="font-size:.84rem;color:var(--a-muted);margin-bottom:16px">
        اربط حساب شركة التوصيل الخاص بك حتى يتمكن RedonBot من إنشاء الشحنات ومتابعة حالتها تلقائيًا،
        وإشعار زبائنك بكل تحديث دون أي تدخل يدوي منك.
      </p>
      <div id="providersWrap"><div class="app-skeleton">جاري التحميل...</div></div>
    </div>
  `;

  const wrap = document.getElementById('providersWrap');

  function fieldsForm(provider) {
    return provider.credentialFields.map((f) => `
      <div class="app-field">
        <label>${escapeHtml(f.label)}</label>
        <input type="${f.type === 'password' ? 'password' : 'text'}" data-cred="${f.key}" placeholder="${escapeHtml(f.label)}" />
      </div>
    `).join('');
  }

  function renderCard(provider) {
    const statusPill = !provider.enabled
      ? `<span class="app-status-pill neutral">قريبًا</span>`
      : provider.connected
        ? `<span class="app-status-pill ok">متصل</span>`
        : `<span class="app-status-pill neutral">غير متصل</span>`;

    const body = !provider.enabled
      ? `<p style="font-size:.82rem;color:var(--a-muted)">هذه الشركة قيد الإضافة قريبًا.</p>`
      : provider.connected
        ? `
          <p style="font-size:.82rem;color:var(--a-muted);margin-bottom:10px">
            تم الربط ${provider.connectedAt ? 'بتاريخ ' + new Date(provider.connectedAt).toLocaleDateString('ar') : ''}
            ${provider.lastTestOk ? '— آخر اختبار اتصال ناجح ✅' : ''}
          </p>
          <div style="display:flex;gap:8px">
            <button class="app-btn app-btn-ghost testBtn" data-id="${provider.id}">اختبار الاتصال</button>
            <button class="app-btn app-btn-danger disconnectBtn" data-id="${provider.id}">فك الربط</button>
          </div>
        `
        : `
          ${fieldsForm(provider)}
          <div style="display:flex;gap:8px">
            <button class="app-btn app-btn-ghost testBtn" data-id="${provider.id}">اختبار الاتصال</button>
            <button class="app-btn app-btn-primary connectBtn" data-id="${provider.id}">ربط الحساب</button>
          </div>
        `;

    return `
      <div class="app-card" data-provider="${provider.id}" style="max-width:520px">
        <div class="app-card-head">
          <h3>${escapeHtml(provider.name)}</h3>
          ${statusPill}
        </div>
        ${body}
        <div class="testMsg" style="font-size:.8rem;margin-top:10px;display:none"></div>
      </div>
    `;
  }

  function collectCreds(card) {
    const creds = {};
    card.querySelectorAll('[data-cred]').forEach((el) => { creds[el.dataset.cred] = el.value.trim(); });
    return creds;
  }

  function wireCard(card, provider) {
    const msgEl = card.querySelector('.testMsg');
    const showMsg = (text, ok) => {
      msgEl.style.display = 'block';
      msgEl.style.color = ok ? 'var(--a-success)' : 'var(--a-danger)';
      msgEl.textContent = text;
    };

    const testBtn = card.querySelector('.testBtn');
    if (testBtn) testBtn.addEventListener('click', async () => {
      testBtn.disabled = true;
      try {
        const creds = provider.connected ? {} : collectCreds(card);
        const res = await fetch(`/api/dashboard/delivery-providers/${provider.id}/test`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify(creds),
        });
        const d = await res.json();
        showMsg(d.message || (d.ok ? 'الاتصال ناجح' : 'فشل الاختبار'), d.ok);
      } catch (err) {
        showMsg(RB_APP.friendlyError(err), false);
      } finally {
        testBtn.disabled = false;
      }
    });

    const connectBtn = card.querySelector('.connectBtn');
    if (connectBtn) connectBtn.addEventListener('click', async () => {
      connectBtn.disabled = true;
      try {
        const creds = collectCreds(card);
        const res = await fetch(`/api/dashboard/delivery-providers/${provider.id}/connect`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify(creds),
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'تعذّر الربط');
        RB_APP.toast('تم ربط الحساب بنجاح', { type: 'success' });
        loadProviders();
      } catch (err) {
        showMsg(RB_APP.friendlyError(err), false);
        connectBtn.disabled = false;
      }
    });

    const disconnectBtn = card.querySelector('.disconnectBtn');
    if (disconnectBtn) disconnectBtn.addEventListener('click', async () => {
      const sure = await RB_APP.confirmDialog({
        title: 'فك ربط الحساب',
        body: `متأكد أنك تريد فك ربط حساب "${escapeHtml(provider.name)}"؟ لن تُنشأ شحنات جديدة عبره حتى تربطه مجددًا.`,
        confirmLabel: 'فك الربط', danger: true,
      });
      if (!sure) return;
      try {
        const res = await fetch(`/api/dashboard/delivery-providers/${provider.id}`, { method: 'DELETE', credentials: 'same-origin' });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error);
        RB_APP.toast('تم فك الربط', { type: 'success' });
        loadProviders();
      } catch (err) {
        RB_APP.toast(RB_APP.friendlyError(err), { type: 'error' });
      }
    });
  }

  async function loadProviders() {
    try {
      const res = await fetch('/api/dashboard/delivery-providers', { credentials: 'same-origin' });
      const data = await res.json();
      if (data.upgradeRequired) {
        wrap.innerHTML = `<div class="app-empty">${RB_APP.svg('empty')}<h3>ميزة مدفوعة</h3><p>${escapeHtml(data.error)}</p></div>`;
        return;
      }
      if (!res.ok) throw new Error(data.error || 'تعذّر جلب شركات التوصيل');

      wrap.innerHTML = data.providers.map(renderCard).join('');
      data.providers.forEach((p) => wireCard(wrap.querySelector(`[data-provider="${p.id}"]`), p));
    } catch (err) {
      wrap.innerHTML = `<div class="app-error-text">${RB_APP.friendlyError(err)}</div>`;
    }
  }

  loadProviders();
})();
</script>
</body>
</html>
