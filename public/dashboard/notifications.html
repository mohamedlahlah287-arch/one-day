<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإشعارات — لوحة التحكم — RedonBot</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/dashboard-app.css">
</head>
<body>
<div id="appRoot" class="app" data-app-theme="dark"></div>

<script src="/assets/dashboard-app.js"></script>
<script>
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function timeAgo(ts) {
  if (!ts) return '';
  const d = ts._seconds ? new Date(ts._seconds * 1000) : new Date(ts);
  return d.toLocaleString('ar');
}

(async function () {
  const me = await RB_APP.initShell('notifications');
  if (!me) return;

  const content = document.getElementById('appPageContent');
  content.innerHTML = `<div class="app-card"><div class="app-card-head"><h3>آخر الإشعارات</h3></div><div id="notifWrap"><div class="app-skeleton">جاري التحميل...</div></div></div>`;

  const wrap = document.getElementById('notifWrap');
  try {
    const res = await fetch('/api/dashboard/notifications', { credentials: 'same-origin' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'تعذّر جلب الإشعارات');

    if (!data.notifications.length) {
      wrap.innerHTML = `<div class="app-empty">${RB_APP.svg('empty')}<h3>لا توجد إشعارات بعد</h3><p>ستصلك هنا إشعارات الطلبات الجديدة إذا اخترت "الموقع" كقناة إشعارات من إعدادات المتجر.</p></div>`;
      return;
    }

    wrap.innerHTML = data.notifications.slice().reverse().map((n) => `
      <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--a-border)">
        <span style="width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:${n.read ? 'var(--a-border-strong)' : 'var(--a-accent)'}"></span>
        <div style="flex:1">
          <div style="font-size:.86rem">${escapeHtml(n.message)}</div>
          <div style="color:var(--a-muted);font-size:.74rem;margin-top:2px">${timeAgo(n.createdAt)}</div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    wrap.innerHTML = `<div class="app-error-text">${RB_APP.friendlyError(err)}</div>`;
  }
})();
</script>
</body>
</html>
