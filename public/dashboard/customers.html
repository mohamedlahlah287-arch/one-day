<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العملاء — لوحة التحكم — RedonBot</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/dashboard-app.css">
</head>
<body>
<div id="appRoot" class="app" data-app-theme="dark"></div>

<script src="/assets/dashboard-app.js"></script>
<script>
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

(async function () {
  const me = await RB_APP.initShell('customers');
  if (!me) return;

  const content = document.getElementById('appPageContent');
  content.innerHTML = `<div class="app-card"><div class="app-card-head"><h3>كل العملاء</h3></div><div id="custWrap"><div class="app-skeleton">جاري التحميل...</div></div></div>`;

  const wrap = document.getElementById('custWrap');
  try {
    const res = await fetch('/api/dashboard/customers', { credentials: 'same-origin' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'تعذّر جلب العملاء');

    if (!data.customers.length) {
      wrap.innerHTML = `<div class="app-empty">${RB_APP.svg('empty')}<h3>لا يوجد عملاء بعد</h3><p>سيظهر هنا كل عميل تواصل معك عبر فيسبوك ماسنجر.</p></div>`;
      return;
    }

    wrap.innerHTML = `
      <table class="app-table">
        <thead><tr><th>الاسم</th><th>الهاتف</th><th>عدد الطلبات</th></tr></thead>
        <tbody>
          ${data.customers.map((c) => `
            <tr>
              <td>${escapeHtml(c.name || 'بدون اسم')}</td>
              <td>${escapeHtml(c.phone || '—')}</td>
              <td class="num">${c.ordersCount || 0}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (err) {
    wrap.innerHTML = `<div class="app-error-text">${RB_APP.friendlyError(err)}</div>`;
  }
})();
</script>
</body>
</html>
